<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Base template{% endblock %}</title>

    <!-- Boostrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom css -->
    <link href="{{ url_for('static', filename='base_one.css') }}" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container d-flex justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('about_us') }}">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('contact_us') }}">Contact Us</a>
                </li>
            </ul>
        </div>
    </nav>
<!-- Flash Messages -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div id="flashToastContainer" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="toast align-items-center text-bg-{{ category }}" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="5000">
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>
</div>

<!-- Page Content -->
<div>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</div>

<!-- Floating Help Icon -->
<div class="floating-help" id="helpPopover" tabindex="0"
     data-bs-toggle="popover"
     data-bs-placement="top"
     data-bs-html="true"
     data-bs-content="
        <div class='popover-body'>
            <section class='mb-3'>
                <h6>Quick Links</h6>
                <ul class='list-unstyled'>
                    <li><a href='{{ url_for('about_us') }}' class='text-primary text-decoration-none'>About Us</a></li>
            </section>
            <section class='mb-3'>
                <h6>Help</h6>
                <ul class='list-unstyled'>
                    <li><a href='{{ url_for('contact_us') }}' class='text-primary text-decoration-none' target='_blank'>FAQ</a></li>
                    <li><a href='{{ url_for('contact_us') + '#contactForm' }}' class='text-primary text-decoration-none'>Contact Form</a></li>
                </ul>
            </section>
        </div>
     ">
    <span>?</span>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='base_one.js') }}"></script>
</body>
</html>
